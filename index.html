function normalize(d){d.mobs=d.mobs||[];d.conditions=d.conditions||[];d.pcs=d.pcs||[];if(!Array.isArray(d.adventures))d.adventures=[{id:id(),name:'Aventura teste 1',scenes:Array.isArray(d.scenes)?d.scenes:[]}];delete d.scenes;d.adventures.forEach(a=>{a.scenes=a.scenes||[];a.places=a.places||[]});return d}
function save(){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saveState').textContent='Salvo ✓'}
function id(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1900)}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t||(t==='scene'&&b.dataset.tab==='scenes')));render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){document.querySelector('.tabs').classList.toggle('hidden',screen!=='adv');document.getElementById('backBtn').classList.toggle('hidden',screen==='home');if(screen==='home')return renderHome();if(screen==='advs')return renderAdvs();if(screen==='opt')return renderData();if(screen==='lib')return renderMobs();if(tab==='scene')return renderScene();if(tab==='places')return renderPlaces();if(tab==='mobs')return renderMobs();renderScenes()}
function renderMobs(){if(libTab==='conds')return renderConds();if(libTab==='pcs')return renderPcs();
 document.getElementById('view').innerHTML=`<div class="head"><h1>Biblioteca</h1></div>${libTabs()}<div class="row between" style="margin-bottom:10px"><div class="muted small">${db.mobs.length} ficha(s) cadastrada(s)</div><button class="primary" onclick="mobForm()">＋ Criar MOB</button></div>
 <input class="search" id="mobSearch" placeholder="⌕ Buscar por nome..." oninput="filterMobs()">
 <div class="fieldrow"><select id="mobCat" onchange="filterMobs()"><option value="">Todas as etiquetas</option>${allMobTags().map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="mobFilter" onchange="filterMobs()"><option value="all">Todos</option><option value="fav">★ Favoritos</option></select></div>
 <div id="mobList">${mobCards(db.mobs)}</div>`;
}
function tagsOf(c){return String(c||'').split(',').map(x=>x.trim()).filter(Boolean)}
function allMobTags(){let seen={};db.mobs.forEach(m=>tagsOf(m.category).forEach(t=>{let k=t.toLowerCase();if(!seen[k])seen[k]=t}));return Object.values(seen).sort((a,b)=>a.localeCompare(b))}
function hasTag(m,t){let k=t.toLowerCase();return tagsOf(m.category).some(x=>x.toLowerCase()===k)}
function mobCards(list){if(!list.length)return `<div class="empty"><b>Nenhum MOB encontrado</b>Crie sua primeira criatura para começar.</div>`;return list.map(m=>`<article class="card"><div class="mobline"><div class="grow"><div class="row"><span class="mobtitle">${esc(m.name)}</span>${tagsOf(m.category).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="small muted">${esc(m.type||'Sem tipo')}${m.level?' · Nível '+esc(m.level):''} · ${m.fields?.length||0} campo(s) personalizado(s)</div></div><button class="fav" onclick="toggleFav('${m.id}')" aria-label="Favorito">${m.fav?'★':'☆'}</button></div><div class="actions" style="margin-top:12px"><button onclick="viewMob('${m.id}')">Ver ficha</button><button onclick="mobForm('${m.id}')">Editar</button><button onclick="duplicateMob('${m.id}')">Duplicar</button><button class="danger" onclick="deleteMob('${m.id}')">Excluir</button></div></article>`).join('')}
function filterMobs(){let q=document.getElementById('mobSearch').value.toLowerCase(),c=document.getElementById('mobCat').value,f=document.getElementById('mobFilter').value;let a=db.mobs.filter(m=>(m.name+' '+m.type+' '+m.category).toLowerCase().includes(q)&&(!c||hasTag(m,c))&&(f!=='fav'||m.fav));document.getElementById('mobList').innerHTML=mobCards(a)}
let formImage='';
function imgHtml(src,cls=''){return src?`<img class="mobimg ${cls}" src="${src}" alt="">`:`<div class="mobimg ph ${cls}">🐉</div>`}
function pickImage(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let sc=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);let x=c.getContext('2d');x.fillStyle='#191b24';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);formImage=c.toDataURL('image/jpeg',0.8);document.getElementById('mImgPrev').innerHTML=imgHtml(formImage)};im.onerror=()=>toast('Imagem inválida');im.src=r.result};r.readAsDataURL(f)}
function clearImage(){formImage='';document.getElementById('mImgPrev').innerHTML=imgHtml('');document.getElementById('mImgFile').value=''}
function toggleFav(mid){let m=db.mobs.find(x=>x.id===mid);m.fav=!m.fav;save();renderMobs()}
function mobForm(mid){let m=db.mobs.find(x=>x.id===mid)||{name:'',type:'',category:'',fields:[],treasure:''};let fields=m.fields||[];formImage=m.image||'';modal(`<div class="modalhead"><h2>${mid?'Editar MOB':'Criar MOB'}</h2><button class="x" onclick="closeModal()">×</button></div>
 <label>Nome</label><input id="mName" value="${esc(m.name)}" placeholder="Ex.: Kobold">
 <div class="fieldrow"><div><label>Tipo de MOB</label><input id="mType" value="${esc(m.type)}" placeholder="Ex.: Humanoide"></div><div><label>Categoria / etiquetas (separe por vírgula)</label><input id="mCategory" value="${esc(m.category)}" placeholder="Ex.: mágico, mar, nadador" oninput="previewTags()"><div id="tagPrev" class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">${tagsOf(m.category).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></div></div>
 <div class="fieldrow"><div><label>Nível da criatura</label><input id="mLevel" value="${esc(m.level||'')}" placeholder="Ex.: 3, ND 2 ou nível 5"></div><div><label>Bônus de iniciativa</label><input id="mInit" type="number" inputmode="numeric" value="${m.initBonus??''}" placeholder="Ex.: 3"></div></div>
 <label>Imagem (opcional)</label><div class="row"><div id="mImgPrev" class="imgbox">${imgHtml(formImage)}</div><div class="grow stack"><input type="file" id="mImgFile" accept="image/*" onchange="pickImage(this)"><button class="danger" onclick="clearImage()">Remover imagem</button></div></div>
 <div class="divider"></div><div class="row between"><b>Campos personalizados</b><button onclick="addFieldRow()">＋ Campo</button></div><div id="fieldRows">${fields.map(f=>fieldRow(f.label,f.value)).join('')}</div>
 <label>Tesouros / recompensas</label><textarea id="mTreasure" rows="3" placeholder="Itens, moedas, observações...">${esc(m.treasure||'')}</textarea>
 <label>Anotações livres</label><textarea id="mNotes" rows="5" placeholder="Particularidades, poderes, comportamento, táticas, informações importantes...">${esc(m.notes||'')}</textarea>
 <div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveMob('${mid||''}')">Salvar MOB</button></div>`);
}
function fieldRow(label='',value=''){return `<div class="fielditem"><input class="fLabel" placeholder="Nome do campo (ex.: Defesa)" value="${esc(label)}"><input class="fValue" placeholder="Valor" value="${esc(value)}"><button class="danger" onclick="this.parentElement.remove()">×</button></div>`}
function addFieldRow(){document.getElementById('fieldRows').insertAdjacentHTML('beforeend',fieldRow())}
function hpFromFields(fields){let f=(fields||[]).find(f=>/^(pv|vida|pontos de vida|hp)$/i.test(f.label));return Math.max(1,Number((f?.value||'1').match(/-?\d+/)?.[0]||1))}
function syncScenes(o,n){let nm=hpFromFields(n.fields);allScenes().forEach(s=>s.members.forEach(m=>{if(m.kind!=='mob'||m.templateId!==n.id)return;let dmg=Math.max(0,m.maxHp-m.hp);if(o&&m.name.startsWith(o.name))m.name=n.name+m.name.slice(o.name.length);m.category=n.category;m.fields=structuredClone(n.fields);m.treasure=n.treasure;m.notes=n.notes;m.level=n.level;m.initBonus=n.initBonus??null;m.maxHp=nm;m.hp=Math.max(0,Math.min(nm,nm-dmg))}))}
function previewTags(){let e=document.getElementById('tagPrev');if(e)e.innerHTML=tagsOf(document.getElementById('mCategory').value).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}
function saveMob(mid){let name=document.getElementById('mName').value.trim();if(!name){toast('Informe o nome do MOB');return}let fields=[...document.querySelectorAll('#fieldRows .fielditem')].map(r=>({label:r.querySelector('.fLabel').value.trim(),value:r.querySelector('.fValue').value.trim()})).filter(f=>f.label);let data={id:mid||id(),name,type:document.getElementById('mType').value.trim(),category:tagsOf(document.getElementById('mCategory').value).join(', '),level:document.getElementById('mLevel').value.trim(),initBonus:(document.getElementById('mInit').value.trim()===''||!Number.isFinite(Number(document.getElementById('mInit').value)))?null:Math.round(Number(document.getElementById('mInit').value)),fields,treasure:document.getElementById('mTreasure').value.trim(),notes:document.getElementById('mNotes').value.trim(),fav:db.mobs.find(m=>m.id===mid)?.fav||false,image:formImage};if(mid){let old=db.mobs.find(m=>m.id===mid);syncScenes(old,data);db.mobs[db.mobs.findIndex(m=>m.id===mid)]=data}else db.mobs.push(data);save();closeModal();renderMobs();toast('MOB salvo')}
function viewMob(mid){let m=db.mobs.find(x=>x.id===mid);modal(`<div class="fichawrap"><div class="modalhead"><h2>${esc(m.name)}</h2><button class="x" onclick="closeModal()">×</button></div><div class="ficha">${imgHtml(m.image)}<div class="grow fichainfo"><div><span class="muted small">Tipo</span><br><b>${esc(m.type||'Sem tipo')}</b></div>${m.category?`<div><span class="muted small">Categoria</span><br><b>${esc(m.category)}</b></div>`:''}${m.level?`<div><span class="muted small">Nível</span><br><b>${esc(m.level)}</b></div>`:''}</div></div><div class="divider"></div><div class="infopane">${(m.fields||[]).map(f=>`<div class="row between card"><span class="muted">${esc(f.label)}</span><b>${esc(f.value)}</b></div>`).join('')||'<p class="muted">Nenhum campo cadastrado.</p>'}<h3>Tesouros / recompensas</h3><p>${esc(m.treasure||'Não informado').replace(/\n/g,'<br>')}</p><h3>Anotações</h3><p>${esc(m.notes||'Nenhuma anotação.').replace(/\n/g,'<br>')}</p></div><button class="primary" onclick="closeModal();mobForm('${mid}')">Editar ficha</button></div>`)}
function duplicateMob(mid){let m=structuredClone(db.mobs.find(x=>x.id===mid));m.id=id();m.name+=' (cópia)';m.fav=false;db.mobs.push(m);save();renderMobs();toast('Ficha duplicada')}
function deleteMob(mid){confirmBox('Excluir esta ficha da biblioteca? Cópias já adicionadas às cenas não serão apagadas.',()=>{db.mobs=db.mobs.filter(m=>m.id!==mid);save();renderMobs()})}
function renderScenes(){document.getElementById('view').innerHTML=`<div class="head"><div><h1>Cenas</h1><div class="muted small">${esc(adv().name)} · ${advScenes().length} cena(s)</div></div><button class="primary" onclick="sceneForm()">＋ Nova cena</button></div>${advScenes().length?advScenes().map(s=>`<article class="card"><div class="row between"><div class="grow"><div class="mobtitle">${esc(s.name)}</div><div class="small muted">${s.members.length} participante(s)</div></div><button onclick="openScene('${s.id}')">Abrir →</button></div><div class="actions" style="margin-top:10px"><button onclick="sceneForm('${s.id}')">Editar nome</button><button class="danger" onclick="deleteScene('${s.id}')">Excluir</button></div></article>`).join(''):'<div class="empty"><b>Nenhuma cena criada</b>Prepare encontros e deixe tudo pronto para a sessão.</div>'}`}
function sceneForm(sid){let s=advScenes().find(x=>x.id===sid)||{name:''};modal(`<div class="modalhead"><h2>${sid?'Editar cena':'Nova cena'}</h2><button class="x" onclick="closeModal()">×</button></div><label>Nome da cena</label><input id="sName" value="${esc(s.name)}" placeholder="Ex.: Emboscada na estrada"><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveScene('${sid||''}')">Salvar</button></div>`)}
function saveScene(sid){let name=document.getElementById('sName').value.trim();if(!name){toast('Informe o nome da cena');return}if(sid)advScenes().find(x=>x.id===sid).name=name;else advScenes().push({id:id(),name,members:[]});save();closeModal();renderScenes()}
function deleteScene(sid){confirmBox('Excluir esta cena e seus dados de combate?',()=>{adv().scenes=adv().scenes.filter(s=>s.id!==sid);save();renderScenes()})}
function openScene(sid){activeScene=sid;tab='scene';scene().members.forEach(initPcHp);renderScene()}
function scene(){return advScenes().find(s=>s.id===activeScene)}
function renderScene(){let s=scene();if(!s){setTab('scenes');return}document.getElementById('view').innerHTML=`<div class="head"><div><button class="ghost" onclick="setTab('scenes')">← Cenas</button><h1 style="margin-top:8px">${esc(s.name)}</h1><div class="small muted">Cena salva automaticamente</div></div><button class="ghost" onclick="toggleMenu()">⋮</button></div><div id="sceneMenu" class="menu ${menuOpen?'':'hidden'}"><button onclick="initiativeForm()">⚑ Definir iniciativa</button><button onclick="rollMobInit()">🎲 Sortear iniciativa dos mobs</button><button onclick="addMembersForm()">＋ Adicionar MOB / participante</button><button onclick="manualHint()">↕ Reorganizar manualmente</button>${s.combat?'<button onclick="endCombat()">■ Encerrar combate</button>':''}<button onclick="resetScene()">↺ Reiniciar cena</button></div><div class="hint">Defina as iniciativas pelo menu ⋮. Depois, arraste os participantes para ajustar a ordem quando alguém atrasar a ação.</div><div class="row between" style="margin:16px 0 8px"><b>Ordem de combate</b>${s.hpLog&&s.hpLog.length?'<button style="padding:5px 10px" onclick="undoHp()">↶ Desfazer PV</button>':`<span class="small muted">${s.members.length} participante(s)</span>`}</div>${turnBar(s)}<div id="combatList">${combatRows(s)}</div><button class="primary" style="width:100%;margin-top:12px" onclick="addMembersForm()">＋ Adicionar à cena</button><details class="scnotes" ${s.notesOpen?'open':''} ontoggle="scene().notesOpen=this.open"><summary>📝 Anotações da cena</summary><textarea rows="7" placeholder="Escreva o que precisar durante a cena..." oninput="scene().notes=this.value;save()">${esc(s.notes||'')}</textarea></details>${lootHtml(s)}`;
 setupDrag();
}
function hpClass(m){let p=m.hp/Math.max(1,m.maxHp);return p<=0.25?'low':p<=0.5?'mid':''}
function combatRows(s){if(!s.members.length)return '<div class="empty"><b>Cena vazia</b>Adicione MOBs ou participantes simples.</div>';return s.members.map((m,i)=>`<div class="combatrow${s.combat&&m.id===s.turnId?' turn':''}${m.kind==='mob'&&m.hp<=0?' down':''}${m.kind==='pj'&&m.ko?' ko':''}" draggable="true" data-index="${i}"><div class="handle">⠿</div><div class="grow"><div class="row nm"><b>${esc(m.name)}</b>${m.kind==='mob'?'<span class="pill">MOB</span>':'<span class="pill">PJ</span>'}${m.kind==='pj'&&m.ko?`<span class="cond ko">Inconsciente (${m.koRounds||0} rod.)</span>`:''}${condChips(m)}</div><div class="small muted">${m.initiative===null||m.initiative===undefined?'Iniciativa —':'Iniciativa '+m.initiative}${m.kind==='mob'&&m.category?' · '+esc(tagsOf(m.category).join(' · ')):''}${m.kind==='pj'?pcLine(m):''}${m.kind==='mob'&&m.hp<=0?' · ☠ Derrotado':''}${m.note?' · 📝':''}</div>${hasHp(m)?`<div class="bar"><i class="${hpClass(m)}" style="width:${Math.max(0,Math.min(100,m.hp/Math.max(1,m.maxHp)*100))}%"></i></div>`:''}</div>${hasHp(m)?`<div class="hp"><button onclick="changeHp('${m.id}',-1)">−</button><button class="hpval" onclick="hpForm('${m.id}')" aria-label="Dano ou cura">${m.hp}<span class="small muted">/${m.maxHp}</span></button><button onclick="changeHp('${m.id}',1)">+</button></div>`:`<button onclick="editParticipant('${m.id}')">✎</button>`}<button class="ghost" onclick="memberDetails('${m.id}')">⋯</button></div>`).join('')}
function toggleMenu(){menuOpen=!menuOpen;document.getElementById('sceneMenu').classList.toggle('hidden',!menuOpen)}
function manualHint(){menuOpen=false;renderScene();toast('Segure e arraste pelo ícone ⠿')}
function addMembersForm(){menuOpen=false;let opts=db.mobs.map(m=>`<option value="${m.id}">${esc(m.name)}${m.category?' · '+esc(m.category):''}</option>`).join('');modal(`<div class="modalhead"><h2>Adicionar à cena</h2><button class="x" onclick="closeModal()">×</button></div><b>Adicionar MOB da biblioteca</b>${db.mobs.length?`<label>Escolha o MOB</label><select id="addMob">${opts}</select><label>Quantidade</label><input id="addQty" type="number" min="1" max="50" value="1"><button class="primary" style="width:100%;margin-top:9px" onclick="addMobToScene()">Adicionar MOBs</button>`:'<p class="muted small">Sua biblioteca ainda está vazia. Você pode criar um MOB na aba Biblioteca.</p>'}<div class="divider"></div>${pcSection()}<b>Adicionar participante simples (PJ)</b><label>Nome / identificação</label><input id="pName" placeholder="Ex.: Ferroso ou P1"><button style="width:100%;margin-top:9px" onclick="addParticipant()">Adicionar participante</button>`)}
function addMobToScene(){let m=db.mobs.find(x=>x.id===document.getElementById('addMob').value),q=Math.max(1,Math.min(50,Number(document.getElementById('addQty').value)||1));for(let i=0;i<q;i++){let hpField=m.fields.find(f=>/^(pv|vida|pontos de vida|hp)$/i.test(f.label));let hp=Math.max(1,Number((hpField?.value||'1').match(/-?\d+/)?.[0]||1));scene().members.push({id:id(),kind:'mob',templateId:m.id,name:m.name+(q>1?' '+(i+1):''),category:m.category,fields:structuredClone(m.fields),treasure:m.treasure,notes:m.notes||'',level:m.level||'',initBonus:m.initBonus??null,maxHp:hp,hp,initiative:null})}save();closeModal();renderScene();toast(q+' MOB(s) adicionado(s)')}
function addParticipant(){let name=document.getElementById('pName').value.trim();if(!name){toast('Informe o nome');return}scene().members.push({id:id(),kind:'pj',name,initiative:null});save();closeModal();renderScene()}
function initiativeForm(){menuOpen=false;let s=scene();modal(`<div class="modalhead"><h2>Definir iniciativa</h2><button class="x" onclick="closeModal()">×</button></div><p class="muted small">Informe o resultado de cada participante. Ao confirmar, a cena será ordenada do maior para o menor.</p>${s.members.map(m=>`<div class="fieldrow" style="align-items:center"><div><b>${esc(m.name)}</b><div class="small muted">${m.kind==='mob'?'MOB':'PJ'}</div></div><input type="number" id="init-${m.id}" placeholder="Iniciativa" value="${m.initiative??''}"></div>`).join('')}<div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="applyInitiative()">Ordenar cena</button></div>`)}
function d20(){return Math.floor(Math.random()*20)+1}
function sortMembers(s){let tid=s.turnId;s.members.sort((a,b)=>(b.initiative??-Infinity)-(a.initiative??-Infinity));if(tid)s.turnId=tid}
function rollMobInit(){menuOpen=false;let s=scene(),mobs=s.members.filter(m=>m.kind==='mob');if(!mobs.length){renderScene();toast('Não há mobs nesta cena');return}let go=()=>{let log=[];mobs.forEach(m=>{let r=d20(),b=Number(m.initBonus)||0;m.initiative=r+b;log.push(m.name+': '+r+(b?(b>0?' + ':' − ')+Math.abs(b):'')+' = '+m.initiative)});sortMembers(s);save();renderScene();modal(`<div class="modalhead"><h2>Iniciativa dos mobs</h2><button class="x" onclick="closeModal()">×</button></div><p class="muted small">Cada mob rolou o próprio d20 mais o bônus da ficha. A cena foi ordenada; os PJs sem iniciativa ficam no fim até você informar.</p>${log.map(l=>`<div class="card" style="margin:6px 0;padding:10px">${esc(l)}</div>`).join('')}<div class="footerbtn"><button onclick="closeModal();rollMobInit()">🎲 Sortear de novo</button><button class="primary" onclick="closeModal()">Fechar</button></div>`)};if(mobs.some(m=>m.initiative!==null&&m.initiative!==undefined)){renderScene();confirmBox('Alguns mobs já têm iniciativa. Sortear de novo substitui os valores deles. Continuar?',go)}else go()}
function applyInitiative(){let s=scene();s.members.forEach(m=>{let v=document.getElementById('init-'+m.id).value;m.initiative=v===''?null:Number(v)});s.members.sort((a,b)=>(b.initiative??-Infinity)-(a.initiative??-Infinity));save();closeModal();renderScene();toast('Iniciativas atualizadas')}
function changeHp(mid,d){let m=getM(mid);logHp(m);m.hp=Math.max(0,Math.min(m.maxHp,m.hp+d));syncKo(m);save();renderScene()}
function setHp(mid,v){let m=getM(mid);logHp(m);m.hp=Math.max(0,Math.min(m.maxHp,Number(v)||0));syncKo(m);save();renderScene()}
function memberDetails(mid){let m=scene().members.find(x=>x.id===mid);if(m.kind==='pj'){modal(`<div class="modalhead"><h2>${esc(m.name)}</h2><button class="x" onclick="closeModal()">×</button></div>${pcInfo(m)}<p class="muted small">Informe o PV máximo para o app controlar o PV e marcar o PJ como inconsciente ao chegar a 0.</p><label>PV máximo (opcional)</label><input id="editMax" type="number" inputmode="numeric" value="${m.maxHp||''}" placeholder="Sem controle de PV">${koBlock(m)}<label>Iniciativa</label><input id="editInit" type="number" value="${m.initiative??''}" placeholder="Não definida"><div class="divider"></div>${memberExtras(m)}<div class="footerbtn"><button class="danger" onclick="removeMember('${mid}')">Remover da cena</button><button class="primary" onclick="saveMemberInit('${mid}')">Salvar</button></div>`)}else{modal(`<div class="fichawrap"><div class="modalhead"><h2>${esc(m.name)}</h2><button class="x" onclick="closeModal()">×</button></div><div class="ficha">${imgHtml(db.mobs.find(x=>x.id===m.templateId)?.image)}<div class="grow"><div class="muted small">Pontos de vida</div><b style="font-size:24px">${m.hp}/${m.maxHp}</b></div></div><div class="divider"></div>${memberExtras(m)}<div class="divider"></div><div class="infopane">${(m.fields||[]).map(f=>`<div class="row between card"><span class="muted">${esc(f.label)}</span><b>${esc(f.value)}</b></div>`).join('')}<h3>Tesouros</h3><p>${esc(m.treasure||'Não informado')}</p><h3>Anotações</h3><p>${esc(m.notes||'Nenhuma anotação.').replace(/\n/g,'<br>')}</p></div><div class="footerbtn"><button class="danger" onclick="removeMember('${mid}')">Remover da cena</button><button class="primary" onclick="closeModal()">Fechar</button></div></div>`)}}
function saveMemberInit(mid){let m=getM(mid),v=document.getElementById('editInit').value;m.initiative=v===''?null:Number(v);let mx=document.getElementById('editMax');if(mx){let n=Math.round(Number(mx.value));if(mx.value!==''&&n>0){let dmg=hasHp(m)?m.maxHp-m.hp:0;m.maxHp=n;m.hp=Math.max(0,n-dmg);delete m.noHp;syncKo(m)}else if(mx.value===''&&hasHp(m)){delete m.hp;delete m.maxHp;m.noHp=true}}save();closeModal();renderScene()}
function editParticipant(mid){let m=scene().members.find(x=>x.id===mid);modal(`<div class="modalhead"><h2>Editar participante</h2><button class="x" onclick="closeModal()">×</button></div><label>Nome</label><input id="pEditName" value="${esc(m.name)}"><label>Iniciativa</label><input id="pEditInit" type="number" value="${m.initiative??''}"><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveParticipant('${mid}')">Salvar</button></div>`)}
function saveParticipant(mid){let m=scene().members.find(x=>x.id===mid);m.name=document.getElementById('pEditName').value.trim()||m.name;let v=document.getElementById('pEditInit').value;m.initiative=v===''?null:Number(v);save();closeModal();renderScene()}
function removeMember(mid){confirmBox('Remover este participante desta cena?',()=>{let s=scene();if(s.turnId===mid){let i=s.members.findIndex(x=>x.id===mid),nx=s.members[i+1]||s.members[0];s.turnId=nx&&nx.id!==mid?nx.id:null}s.members=s.members.filter(x=>x.id!==mid);save();renderScene()})}
function setupDrag(){let list=document.getElementById('combatList');if(!list)return;let dragged=null;list.querySelectorAll('.combatrow').forEach(el=>{el.addEventListener('dragstart',e=>{dragged=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>{if(dragged)dragged.classList.remove('dragging');dragged=null});el.addEventListener('dragover',e=>{e.preventDefault();if(!dragged||dragged===el)return;let r=el.getBoundingClientRect();let after=e.clientY>r.top+r.height/2;list.insertBefore(dragged,after?el.nextSibling:el)});el.addEventListener('drop',e=>{e.preventDefault();let ids=[...list.querySelectorAll('.combatrow')].map(x=>scene().members[Number(x.dataset.index)]?.id);let old=scene().members;scene().members=ids.map(x=>old.find(m=>m.id===x)).filter(Boolean);save();renderScene()})})}
let libTab='mobs',cpOpen=false,edCid=null,edDur=null,formCondColor='#c58b52';
const CPAL=['#e05555','#e0813a','#e0b64a','#67b58a','#4fb8b0','#83a9d8','#8e7cc3','#d86fae','#a6a8b3','#f3f3f5'];
function condColor(c){return c.color||'#c58b52'}
function condTxt(h){let n=parseInt(h.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?'#14151c':'#ffffff'}
function condStyle(c){let col=condColor(c);return `background:${col};border-color:${col};color:${condTxt(col)}`}
function libTabs(){return `<div class="seg"><button class="${libTab==='mobs'?'active':''}" onclick="setLib('mobs')"><img src="${IMG.mob}" alt="">Mobs</button><button class="${libTab==='pcs'?'active':''}" onclick="setLib('pcs')"><img src="${IMG.pj}" alt="">PJs</button><button class="${libTab==='conds'?'active':''}" onclick="setLib('conds')"><img src="${IMG.cond}" alt="">Condições</button></div>`}
function setLib(t){libTab=t;renderMobs()}
function condCats(){return [...new Set(db.conditions.map(c=>c.category).filter(Boolean))].sort()}
function sortConds(l){return [...l].sort((a,b)=>(!a.category)-(!b.category)||(a.category||'').localeCompare(b.category||'')||a.name.localeCompare(b.name))}
function renderConds(){document.getElementById('view').innerHTML=`<div class="head"><h1>Biblioteca</h1></div>${libTabs()}<div class="row between" style="margin-bottom:10px"><div class="muted small">${db.conditions.length} condição(ões)</div><button class="primary" onclick="condForm()">＋ Criar condição</button></div><input class="search" id="condSearch" placeholder="⌕ Buscar condição..." oninput="filterConds()"><select id="condCat" onchange="filterConds()" style="margin-bottom:10px"><option value="">Todas as categorias</option>${condCats().map(c=>`<option>${esc(c)}</option>`).join('')}</select><div id="condList">${condCards(db.conditions)}</div>`}
function condCards(list){if(!db.conditions.length)return '<div class="empty"><b>Nenhuma condição</b>Crie condições como Caído ou Agarrado para aplicar nos participantes da cena.</div>';if(!list.length)return '<div class="empty"><b>Nenhuma condição encontrada</b></div>';return sortConds(list).map(c=>`<article class="card"><div class="row"><i class="dot" style="background:${condColor(c)}"></i><span class="mobtitle">${esc(c.name)}</span>${c.category?`<span class="pill">${esc(c.category)}</span>`:''}</div><div class="small muted clamp" style="margin-top:6px">${esc(c.desc||'Sem descrição.')}</div><div class="actions" style="margin-top:10px"><button onclick="condForm('${c.id}')">Editar</button><button class="danger" onclick="deleteCond('${c.id}')">Excluir</button></div></article>`).join('')}
function filterConds(){let q=document.getElementById('condSearch').value.toLowerCase(),cat=document.getElementById('condCat').value;document.getElementById('condList').innerHTML=condCards(db.conditions.filter(c=>(c.name+' '+(c.category||'')).toLowerCase().includes(q)&&(!cat||c.category===cat)))}
function swatches(){return CPAL.map(c=>`<button type="button" class="${c===formCondColor?'sel':''}" style="background:${c}" onclick="setCondColor('${c}')" aria-label="Cor ${c}"></button>`).join('')}
function setCondColor(c){formCondColor=c;document.getElementById('cSwatches').innerHTML=swatches();document.getElementById('cColor').value=c;updCondPrev()}
function updCondPrev(){let n=document.getElementById('cName').value.trim()||'Condição';let e=document.getElementById('cPrev');e.textContent=n;e.setAttribute('style',condStyle({color:formCondColor}))}
function condForm(cid){let c=db.conditions.find(x=>x.id===cid)||{name:'',desc:'',category:''};formCondColor=condColor(c);modal(`<div class="modalhead"><h2>${cid?'Editar condição':'Criar condição'}</h2><button class="x" onclick="closeModal()">×</button></div><label>Nome da condição</label><input id="cName" value="${esc(c.name)}" placeholder="Ex.: Caído" oninput="updCondPrev()"><label>Categoria / grupo</label><input id="cCategory" list="condCatList" value="${esc(c.category||'')}" placeholder="Ex.: Controle, Dano contínuo"><datalist id="condCatList">${condCats().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label>Cor</label><div class="sw"><span id="cSwatches" class="sw" style="margin:0">${swatches()}</span><input type="color" id="cColor" value="${formCondColor}" oninput="setCondColor(this.value)" aria-label="Cor personalizada"></div><div style="margin-top:8px"><span id="cPrev" class="cond pick on" style="${condStyle({color:formCondColor})}">${esc(c.name||'Condição')}</span></div><label>Descrição</label><textarea id="cDesc" rows="6" placeholder="O que essa condição causa...">${esc(c.desc||'')}</textarea><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveCond('${cid||''}')">Salvar condição</button></div>`)}
function saveCond(cid){let name=document.getElementById('cName').value.trim();if(!name){toast('Informe o nome da condição');return}let desc=document.getElementById('cDesc').value.trim(),category=document.getElementById('cCategory').value.trim();if(cid){let c=db.conditions.find(x=>x.id===cid);c.name=name;c.desc=desc;c.category=category;c.color=formCondColor}else db.conditions.push({id:id(),name,desc,category,color:formCondColor});save();closeModal();renderMobs();if(scene&&activeScene&&tab==='scene')renderScene();toast('Condição salva')}
function deleteCond(cid){confirmBox('Excluir esta condição? Ela também será removida dos participantes das cenas.',()=>{db.conditions=db.conditions.filter(c=>c.id!==cid);allScenes().forEach(s=>s.members.forEach(m=>{if(m.conds)m.conds=m.conds.filter(x=>x!==cid);if(m.cdur)delete m.cdur[cid]}));save();renderMobs()})}
function condChips(m){return (m.conds||[]).map(i=>db.conditions.find(c=>c.id===i)).filter(Boolean).map(c=>{let d=(m.cdur||{})[c.id];return `<button class="cond" style="${condStyle(c)}" onclick="condInfo('${c.id}','${m.id}')">${esc(c.name)}${d?` (${d})`:''}</button>`}).join('')}
function condInfo(cid,mid){let c=db.conditions.find(x=>x.id===cid);if(!c)return;let m=mid?getM(mid):null,d=m&&m.cdur?m.cdur[cid]:null,dur=m?(d?`Duração restante: ${d} rodada(s)`:'Duração: indefinida'):'';document.getElementById('modalRoot').innerHTML=`<div class="modalbg" style="align-items:center;padding:16px" onclick="if(event.target===this)closeModal()"><section class="modal" style="border-radius:16px;max-width:420px;padding-bottom:18px;border-top:4px solid ${condColor(c)}"><div class="modalhead"><h2>${esc(c.name)}</h2><button class="x" onclick="closeModal()">×</button></div><div class="small muted" style="margin-bottom:8px">${[c.category?esc(c.category):'',dur].filter(Boolean).join(' · ')}</div><p style="white-space:pre-wrap;margin:0">${esc(c.desc||'Sem descrição.')}</p></section></div>`}
function condActive(m){let act=(m.conds||[]).map(i=>db.conditions.find(c=>c.id===i)).filter(Boolean);return act.length?`<div class="condlist" style="margin-bottom:8px">${act.map(c=>{let d=(m.cdur||{})[c.id];return `<button class="cond pick" style="${condStyle(c)}" onclick="editCond('${m.id}','${c.id}')">${esc(c.name)}${d?` (${d})`:''} ✎</button>`}).join('')}</div><div class="small muted" style="margin:-2px 0 8px">Toque numa condição ativa para mudar a duração ou remover.</div>`:'<div class="small muted" style="margin-bottom:8px">Nenhuma condição ativa.</div>'}
function condPickBtn(m){return db.conditions.length?`<button onclick="openCondPick('${m.id}')">Selecionar condição ▾</button>`:'<p class="muted small" style="margin:0">Nenhuma condição criada ainda. Crie em Biblioteca → Condições.</p>'}
function condListHtml(m,q,cat){let l=sortConds(db.conditions.filter(c=>(c.name+' '+(c.category||'')).toLowerCase().includes(q)&&(!cat||c.category===cat)));if(!l.length)return '<div class="small muted" style="padding:8px">Nenhuma condição encontrada.</div>';return l.map(c=>{let on=(m.conds||[]).includes(c.id);return `<button class="cprow ${on?'on':''}" onclick="editCond('${m.id}','${c.id}')"><i class="dot" style="background:${condColor(c)}"></i><span class="grow"><b>${esc(c.name)}</b>${c.category?` <span class="small muted">· ${esc(c.category)}</span>`:''}</span>${on?'✓':''}</button>`}).join('')}
function condPickPanel(m){return `<div class="cpanel"><input id="cpSearch" placeholder="⌕ Buscar condição..." oninput="renderCondList('${m.id}')">${condCats().length?`<select id="cpCat" onchange="renderCondList('${m.id}')" style="margin-top:8px"><option value="">Todas as categorias</option>${condCats().map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:''}<div id="cpList" class="cplist">${condListHtml(m,'','')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="closeCondPick('${m.id}')">Fechar lista</button></div>`}
function getM(mid){return scene().members.find(x=>x.id===mid)}
function openCondPick(mid){cpOpen=true;document.getElementById('condPick').innerHTML=condPickPanel(getM(mid))}
function closeCondPick(mid){cpOpen=false;document.getElementById('condPick').innerHTML=condPickBtn(getM(mid))}
function renderCondList(mid){let q=document.getElementById('cpSearch').value.toLowerCase(),c=document.getElementById('cpCat');document.getElementById('cpList').innerHTML=condListHtml(getM(mid),q,c?c.value:'')}
function setNote(mid,v){getM(mid).note=v;save()}
function memberExtras(m){cpOpen=false;edCid=null;edDur=null;return `<b>Condições</b><div style="margin-top:8px"><div id="condActive">${condActive(m)}</div><div id="condPick">${condPickBtn(m)}</div></div><label>Anotação (só desta cena)</label><textarea rows="4" placeholder="Anote o que precisar sobre este participante..." oninput="setNote('${m.id}',this.value)" onchange="renderScene()">${esc(m.note||'')}</textarea>`}
function edDurCtl(){let n=edDur!==null;return `<div class="row" style="flex-wrap:wrap"><button class="${n?'':'primary'}" style="padding:6px 10px" onclick="setEdDur(null)">∞ Indefinida</button><div class="row" style="gap:4px"><button style="padding:6px 12px" onclick="setEdDur(-1)" aria-label="Menos uma rodada">−</button><b style="min-width:92px;text-align:center;color:${n?'var(--accent)':'var(--muted)'}">${n?edDur+' rodada(s)':'rodadas'}</b><button style="padding:6px 12px" onclick="setEdDur(1)" aria-label="Mais uma rodada">+</button></div></div>`}
function setEdDur(d){edDur=d===null?null:Math.max(1,(edDur||0)+d);document.getElementById('edDur').innerHTML=edDurCtl()}
function condEditor(m){let c=db.conditions.find(x=>x.id===edCid),act=(m.conds||[]).includes(edCid);return `<div class="cpanel"><div class="row"><i class="dot" style="background:${condColor(c)}"></i><b>${esc(c.name)}</b></div><div class="small muted" style="margin:8px 0 6px">Duração</div><div id="edDur">${edDurCtl()}</div><div class="footerbtn"><button onclick="cancelCondEdit('${m.id}')">Cancelar</button>${act?`<button class="danger" onclick="removeCond('${m.id}')">Remover</button>`:''}<button class="primary" onclick="confirmCond('${m.id}')">${act?'Salvar':'Aplicar'}</button></div></div>`}
function editCond(mid,cid){let m=getM(mid),d=(m.cdur||{})[cid];edCid=cid;edDur=d?d:null;document.getElementById('condPick').innerHTML=condEditor(m)}
function backPick(m){edCid=null;document.getElementById('condPick').innerHTML=cpOpen?condPickPanel(m):condPickBtn(m)}
function cancelCondEdit(mid){backPick(getM(mid))}
function confirmCond(mid){let m=getM(mid),cid=edCid,c=db.conditions.find(x=>x.id===cid);m.conds=m.conds||[];if(!m.conds.includes(cid))m.conds.push(cid);m.cdur=m.cdur||{};if(edDur!==null)m.cdur[cid]=edDur;else delete m.cdur[cid];save();document.getElementById('condActive').innerHTML=condActive(m);backPick(m);renderScene();toast(c.name+(edDur!==null?' · '+edDur+' rodada(s)':' · indefinida'))}
function removeCond(mid){let m=getM(mid),cid=edCid;m.conds=(m.conds||[]).filter(x=>x!==cid);if(m.cdur)delete m.cdur[cid];save();document.getElementById('condActive').innerHTML=condActive(m);backPick(m);renderScene()}
function hpForm(mid){let m=getM(mid);modal(`<div class="modalhead"><h2>${esc(m.name)}</h2><button class="x" onclick="closeModal()">×</button></div><div class="row between"><span class="muted">Pontos de vida</span><b>${m.hp}/${m.maxHp}</b></div><label>Valor</label><input id="hpVal" type="number" inputmode="numeric" min="0" placeholder="Ex.: 14"><div class="footerbtn"><button class="danger" onclick="applyHp('${mid}','dmg')">Dano</button><button class="primary" onclick="applyHp('${mid}','heal')">Cura</button></div><button class="ghost" style="width:100%;margin-top:8px" onclick="applyHp('${mid}','set')">Definir PV com este valor</button>`);setTimeout(()=>{let e=document.getElementById('hpVal');if(e)e.focus()},60)}
function applyHp(mid,mode){let m=getM(mid),raw=document.getElementById('hpVal').value;if(raw===''||!Number.isFinite(Number(raw))){toast('Informe um valor');return}let v=Math.abs(Number(raw)),old=m.hp;logHp(m);m.hp=mode==='dmg'?m.hp-v:mode==='heal'?m.hp+v:v;m.hp=Math.max(0,Math.min(m.maxHp,m.hp));syncKo(m);save();closeModal();renderScene();toast(m.name+': '+old+' → '+m.hp+(m.hp===0?(m.kind==='pj'?' 💤':' ☠'):''))}
function activeMember(m){return !(m.kind==='mob'&&m.hp<=0)}
function turnBar(s){if(!s.members.length)return '';if(!s.combat)return `<button class="primary" style="width:100%;margin-bottom:8px" onclick="startCombat()">▶ Iniciar combate</button>`;let cur=s.members.find(m=>m.id===s.turnId);return `<div class="turnbar"><div><div class="small muted">Rodada</div><b class="big">${s.round||1}</b></div><div class="grow"><div class="small muted">Vez de</div><b class="turnname">${esc(cur?cur.name:'—')}</b></div><button onclick="undoTurn()" aria-label="Desfazer" ${s.prev?'':'disabled'}>↶</button><button class="primary" onclick="nextTurn()">Próximo ▶</button></div>`}
function startCombat(){let s=scene();if(!s.members.length)return;s.combat=true;s.round=1;s.prev=null;s.turnId=(s.members.find(activeMember)||s.members[0]).id;save();renderScene();toast('Combate iniciado')}
function endCombat(){menuOpen=false;renderScene();confirmBox('Encerrar o combate? A rodada e o turno serão zerados. As condições continuam nos participantes.',()=>{let s=scene();s.combat=false;s.round=1;s.turnId=null;s.prev=null;save();renderScene()})}
function nextTurn(){let s=scene(),ms=s.members,n=ms.length;if(!n)return;s.prev={turnId:s.turnId,round:s.round,cd:ms.map(m=>({id:m.id,conds:[...(m.conds||[])],cdur:{...(m.cdur||{})},ko:m.koRounds}))};let j=ms.findIndex(m=>m.id===s.turnId),newRound=false,k=0,anyActive=ms.some(activeMember);do{j++;if(j>=n){j=0;newRound=true}k++}while(k<=n&&anyActive&&!activeMember(ms[j]));let ended=[];if(newRound){s.round=(s.round||1)+1;ms.forEach(m=>{if(m.ko)m.koRounds=(m.koRounds||0)+1;if(!m.cdur)return;Object.keys(m.cdur).forEach(cid=>{m.cdur[cid]-=1;if(m.cdur[cid]<=0){delete m.cdur[cid];m.conds=(m.conds||[]).filter(x=>x!==cid);let c=db.conditions.find(x=>x.id===cid);if(c)ended.push(c.name+' ('+m.name+')')}})})}s.turnId=ms[j].id;save();renderScene();let el=document.querySelector('.combatrow.turn');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});if(ended.length)toast('Terminou: '+ended.join(', '))}
function undoTurn(){let s=scene();if(!s.prev)return;s.turnId=s.prev.turnId;s.round=s.prev.round;s.prev.cd.forEach(x=>{let m=s.members.find(y=>y.id===x.id);if(m){m.conds=x.conds;m.cdur=x.cdur;if(x.ko!==undefined)m.koRounds=x.ko}});s.prev=null;save();renderScene();toast('Turno desfeito')}
function pcOf(m){return m.pcId?db.pcs.find(p=>p.id===m.pcId):null}
function pcLine(m){let p=pcOf(m);return p?(p.hp&&!hasHp(m)?' · PV '+esc(p.hp):'')+(p.def?' · Def '+esc(p.def):''):''}
function pcInfo(m){let p=pcOf(m);if(!p)return '';return `<div class="fieldrow" style="margin-bottom:10px"><div class="stat"><span class="small muted">PV</span><b>${esc(p.hp||'—')}</b></div><div class="stat"><span class="small muted">Defesa</span><b>${esc(p.def||'—')}</b></div></div>${p.player?`<p class="muted small">Jogador: ${esc(p.player)}</p>`:''}${p.notes?`<h3>Anotações do PJ</h3><p>${esc(p.notes).replace(/\n/g,'<br>')}</p>`:''}`}
function renderPcs(){document.getElementById('view').innerHTML=`<div class="head"><h1>Biblioteca</h1></div>${libTabs()}<div class="row between" style="margin-bottom:10px"><div class="muted small">${db.pcs.length} PJ(s) cadastrado(s)</div><button class="primary" onclick="pcForm()">＋ Criar PJ</button></div>${db.pcs.length?db.pcs.map(p=>`<article class="card"><div class="mobtitle">${esc(p.name)}</div>${p.player?`<div class="small muted">Jogador: ${esc(p.player)}</div>`:''}<div class="fieldrow" style="margin-top:8px"><div class="stat"><span class="small muted">PV</span><b>${esc(p.hp||'—')}</b></div><div class="stat"><span class="small muted">Defesa</span><b>${esc(p.def||'—')}</b></div></div><div class="actions" style="margin-top:10px"><button onclick="pcForm('${p.id}')">Editar</button><button class="danger" onclick="deletePc('${p.id}')">Excluir</button></div></article>`).join(''):'<div class="empty"><b>Nenhum PJ salvo</b>Cadastre os personagens da mesa para adicioná-los às cenas com um toque.</div>'}`}
function pcForm(pid){let p=db.pcs.find(x=>x.id===pid)||{name:'',player:'',hp:'',def:'',notes:''};modal(`<div class="modalhead"><h2>${pid?'Editar PJ':'Criar PJ'}</h2><button class="x" onclick="closeModal()">×</button></div><label>Nome do personagem</label><input id="pcName" value="${esc(p.name)}" placeholder="Ex.: Orfeu"><label>Jogador (opcional)</label><input id="pcPlayer" value="${esc(p.player||'')}"><div class="fieldrow"><div><label>PV máximo</label><input id="pcHp" value="${esc(p.hp||'')}" placeholder="Ex.: 45"></div><div><label>Defesa</label><input id="pcDef" value="${esc(p.def||'')}" placeholder="Ex.: 22"></div></div><label>Anotações</label><textarea id="pcNotes" rows="4">${esc(p.notes||'')}</textarea><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePc('${pid||''}')">Salvar PJ</button></div>`)}
function savePc(pid){let name=document.getElementById('pcName').value.trim();if(!name){toast('Informe o nome do PJ');return}let d={name,player:document.getElementById('pcPlayer').value.trim(),hp:document.getElementById('pcHp').value.trim(),def:document.getElementById('pcDef').value.trim(),notes:document.getElementById('pcNotes').value.trim()};let p;if(pid){p=db.pcs.find(x=>x.id===pid);Object.assign(p,d)}else{p={id:id(),...d};db.pcs.push(p)}let nmx=pcMax(p);allScenes().forEach(s=>s.members.forEach(m=>{if(m.pcId===p.id){m.name=p.name;if(nmx&&!m.noHp){let dmg=hasHp(m)?m.maxHp-m.hp:0;m.maxHp=nmx;m.hp=Math.max(0,nmx-dmg);syncKo(m)}}}));save();closeModal();renderMobs();toast('PJ salvo')}
function deletePc(pid){confirmBox('Excluir este PJ da biblioteca? Nas cenas ele continua como participante simples.',()=>{db.pcs=db.pcs.filter(p=>p.id!==pid);save();renderMobs()})}
function inScenePc(pid){return scene().members.some(m=>m.pcId===pid)}
function pcPickHtml(){return `<div class="condlist">${db.pcs.map(p=>`<button class="cond pick ${inScenePc(p.id)?'on':''}" onclick="addPc('${p.id}')">${esc(p.name)}${inScenePc(p.id)?' ✓':''}</button>`).join('')}</div><button style="width:100%;margin-top:8px" onclick="addAllPcs()">Adicionar todos</button>`}
function pcSection(){return db.pcs.length?`<b>Adicionar PJ da biblioteca</b><div id="pcPick" style="margin-top:8px">${pcPickHtml()}</div><div class="divider"></div>`:''}
function addPc(pid){let p=db.pcs.find(x=>x.id===pid);if(!p)return;if(inScenePc(pid)){toast(p.name+' já está na cena');return}scene().members.push(pcMember(p));save();renderScene();document.getElementById('pcPick').innerHTML=pcPickHtml()}
function addAllPcs(){let n=0;db.pcs.forEach(p=>{if(!inScenePc(p.id)){scene().members.push(pcMember(p));n++}});save();renderScene();document.getElementById('pcPick').innerHTML=pcPickHtml();toast(n?n+' PJ(s) adicionado(s)':'Todos já estão na cena')}
function koBlock(m){if(hasHp(m))return m.ko?`<div class="small muted" style="margin:6px 0">Inconsciente há ${m.koRounds||0} rodada(s). Volta ao ficar com mais de 0 PV.</div>`:`<div class="small muted" style="margin:6px 0">Fica inconsciente automaticamente ao chegar a 0 PV.</div>`;return `<button class="${m.ko?'primary':''}" style="width:100%;margin:6px 0 4px" onclick="toggleKo('${m.id}')">${m.ko?'☀ Reanimar (acordou)':'💤 Marcar como inconsciente'}</button>${m.ko?`<div class="small muted">Inconsciente há ${m.koRounds||0} rodada(s).</div>`:''}`}
function toggleKo(mid){let m=getM(mid);m.ko=!m.ko;if(m.ko)m.koRounds=0;else delete m.koRounds;save();closeModal();renderScene();toast(m.name+(m.ko?' está inconsciente':' acordou'))}
const MKEY='covilMetaV1';
function meta(){try{return JSON.parse(localStorage.getItem(MKEY))||{}}catch(e){return {}}}
function setMeta(o){try{localStorage.setItem(MKEY,JSON.stringify({...meta(),...o}))}catch(e){}}
function hasData(){return db.mobs.length||db.pcs.length||db.conditions.length||db.adventures.some(a=>a.scenes.length)}
function lastBackupText(){let m=meta();return m.last?'Último backup exportado: '+new Date(m.last).toLocaleDateString('pt-BR'):'Nenhum backup exportado ainda.'}
function backupBanner(){if(!hasData())return '';let m=meta(),now=Date.now();if(m.snooze&&now<m.snooze)return '';let days=m.last?Math.floor((now-m.last)/86400000):null;if(days!==null&&days<7)return '';return `<div class="hint" style="margin-bottom:14px"><b>💾 Hora de fazer backup</b><div style="margin:4px 0 10px">${days===null?'Você ainda não exportou nenhum backup.':'Faz '+days+' dia(s) desde o último backup.'} Se os dados do navegador forem apagados, suas fichas somem.</div><div class="row"><button class="primary" onclick="backupNow()">Exportar agora</button><button onclick="snoozeBackup()">Lembrar amanhã</button></div></div>`}
function backupNow(){exportData();render()}
function snoozeBackup(){setMeta({snooze:Date.now()+86400000});render()}
let wake=null;
function wakeInd(){let e=document.getElementById('wakeInd');if(e)e.textContent=wake?'🔆 ':''}
async function wakeOn(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;wakeInd()});wakeInd()}}catch(e){wake=null}}
function wakeOff(){try{if(wake)wake.release()}catch(e){}wake=null;wakeInd()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&screen==='adv')wakeOn()});
function adv(){return db.adventures.find(a=>a.id===curAdv)}
function advScenes(){let a=adv();return a?a.scenes:[]}
function allScenes(){return db.adventures.flatMap(a=>a.scenes)}
function goHome(){screen='home';curAdv=null;activeScene=null;menuOpen=false;wakeOff();closeModal();render();window.scrollTo(0,0)}
function goAdvs(){screen='advs';render()}
function goLib(){screen='lib';libTab='mobs';render()}
function goOpt(){screen='opt';render()}
function goBack(){menuOpen=false;closeModal();if(screen==='adv'){if(tab==='scene'){setTab('scenes');return}if(tab==='places'&&placePath.length){placePath.pop();render();window.scrollTo(0,0);return}curAdv=null;activeScene=null;wakeOff();screen='advs'}else screen='home';render();window.scrollTo(0,0)}
function renderHome(){document.getElementById('view').innerHTML=`${backupBanner()}<div style="margin:6px 0 10px"><h1 style="margin:8px 0 2px;font-size:26px">Covil do Mestre</h1><div class="muted small">Escolha por onde começar.</div></div><button class="menubtn" onclick="goAdvs()"><span class="ico i"><img src="${IMG.adv}" alt=""></span><span><b>Aventuras</b><span class="muted small">${db.adventures.length} aventura(s)</span></span></button><button class="menubtn" onclick="goLib()"><span class="ico i"><img src="${IMG.lib}" alt=""></span><span><b>Biblioteca</b><span class="muted small">Mobs, PJs e condições de todas as aventuras</span></span></button><button class="menubtn" onclick="goOpt()"><span class="ico i"><img src="${IMG.opt}" alt=""></span><span><b>Opções</b><span class="muted small">Backup e dados</span></span></button>`}
function renderAdvs(){document.getElementById('view').innerHTML=`<div class="head"><div><h1>Aventuras</h1><div class="muted small">${db.adventures.length} aventura(s)</div></div><button class="primary" onclick="advForm()">＋ Nova aventura</button></div>${db.adventures.length?db.adventures.map(a=>`<article class="card"><div class="row between"><div class="grow"><div class="mobtitle">${esc(a.name)}</div><div class="small muted">${a.scenes.length} cena(s)</div></div><button class="primary" onclick="openAdv('${a.id}')">Abrir →</button></div><div class="actions" style="margin-top:10px"><button onclick="advForm('${a.id}')">Editar nome</button><button class="danger" onclick="deleteAdv('${a.id}')">Excluir</button></div></article>`).join(''):'<div class="empty"><b>Nenhuma aventura</b>Crie uma aventura para organizar suas cenas.</div>'}`}
function advForm(aid){let a=db.adventures.find(x=>x.id===aid)||{name:''};modal(`<div class="modalhead"><h2>${aid?'Editar aventura':'Nova aventura'}</h2><button class="x" onclick="closeModal()">×</button></div><label>Nome da aventura</label><input id="aName" value="${esc(a.name)}" placeholder="Ex.: A Maldição de Lamnor"><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveAdv('${aid||''}')">Salvar</button></div>`)}
function saveAdv(aid){let name=document.getElementById('aName').value.trim();if(!name){toast('Informe o nome da aventura');return}if(aid)db.adventures.find(x=>x.id===aid).name=name;else db.adventures.push({id:id(),name,scenes:[]});save();closeModal();renderAdvs()}
function deleteAdv(aid){confirmBox('Excluir esta aventura e todas as suas cenas? Mobs, PJs e condições da biblioteca não são afetados.',()=>{db.adventures=db.adventures.filter(a=>a.id!==aid);save();renderAdvs()})}
function openAdv(aid){curAdv=aid;screen='adv';activeScene=null;placePath=[];wakeOn();setTab('scenes');window.scrollTo(0,0)}
function hasHp(m){return m.maxHp>0}
function syncKo(m){if(m.kind!=='pj'||!hasHp(m))return;if(m.hp<=0){if(!m.ko){m.ko=true;m.koRounds=0}}else if(m.ko){m.ko=false;delete m.koRounds}}
function pcMax(p){let n=parseInt(String((p&&p.hp)||'').match(/\d+/)?.[0]);return n>0?n:0}
function pcMember(p){let n=pcMax(p),m={id:id(),kind:'pj',name:p.name,pcId:p.id,initiative:null};if(n){m.maxHp=n;m.hp=n}return m}
function initPcHp(m){if(m.kind==='pj'&&!hasHp(m)&&!m.noHp&&m.pcId){let n=pcMax(pcOf(m));if(n){m.maxHp=n;m.hp=n}}}
function logHp(m){let s=scene();s.hpLog=s.hpLog||[];s.hpLog.push({id:m.id,hp:m.hp});if(s.hpLog.length>30)s.hpLog.shift()}
function undoHp(){let s=scene();while(s.hpLog&&s.hpLog.length){let e=s.hpLog.pop(),m=s.members.find(x=>x.id===e.id);if(m&&hasHp(m)){let cur=m.hp;m.hp=e.hp;syncKo(m);save();renderScene();toast(m.name+': '+cur+' → '+m.hp);return}}save();renderScene();toast('Nada para desfazer')}
function resetScene(){menuOpen=false;renderScene();confirmBox('Reiniciar a cena? Todos voltam ao PV cheio, condições e inconsciência são removidas e o combate é encerrado. Iniciativas e anotações ficam.',()=>{let s=scene();s.members.forEach(m=>{if(hasHp(m))m.hp=m.maxHp;m.conds=[];m.cdur={};delete m.ko;delete m.koRounds});s.combat=false;s.round=1;s.turnId=null;s.prev=null;s.hpLog=[];save();renderScene();toast('Cena reiniciada')})}

document.querySelectorAll('[data-img]').forEach(i=>{i.src=IMG[i.dataset.img]});
function lootLines(t){return String(t||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean)}
function lootTotals(list){let sums={},cnt={};list.forEach(m=>lootLines(m.treasure).forEach(l=>{let q=l.match(/^(\d+)\s+(.+)$/);if(q){let k=q[2].toLowerCase();sums[k]=sums[k]||{n:0,label:q[2]};sums[k].n+=Number(q[1])}else{let k=l.toLowerCase();cnt[k]=cnt[k]||{n:0,label:l};cnt[k].n++}}));return [...Object.values(sums).map(x=>x.n+' '+x.label),...Object.values(cnt).map(x=>(x.n>1?x.n+'× ':'')+x.label)]}
function lootHtml(s){let mobs=s.members.filter(m=>m.kind==='mob'&&lootLines(m.treasure).length),use=s.lootDefeated?mobs.filter(m=>m.hp<=0):mobs,tot=lootTotals(use);return `<details class="scnotes" ${s.lootOpen?'open':''} ontoggle="scene().lootOpen=this.open"><summary>💰 Tesouros da cena</summary><label class="row" style="gap:8px;margin:10px 0"><input type="checkbox" style="width:auto" ${s.lootDefeated?'checked':''} onchange="scene().lootDefeated=this.checked;save();renderScene()"> Só dos mobs derrotados (PV 0)</label>${use.length?`<b>Total</b>${tot.map(t=>`<div class="card" style="margin:6px 0;padding:9px 12px">${esc(t)}</div>`).join('')}<b style="display:block;margin-top:12px">Por mob</b>${use.map(m=>`<div class="small" style="margin:6px 0"><b>${m.hp<=0?'☠ ':''}${esc(m.name)}:</b> <span class="muted">${esc(lootLines(m.treasure).join(' · '))}</span></div>`).join('')}`:`<div class="muted small">${mobs.length?'Nenhum mob derrotado ainda.':'Nenhum mob desta cena tem tesouro. Preencha "Tesouros" na ficha do mob.'}</div>`}</details>`}
let placePath=[];
function advPlaces(){let a=adv();return a.places||(a.places=[])}
function placeAt(path){let list=advPlaces(),p=null;for(const i of path){p=list.find(x=>x.id===i);if(!p)return null;list=p.children||(p.children=[])}return p}
function curPlace(){return placePath.length?placeAt(placePath):null}
function placeKids(){let p=curPlace();return p?(p.children||(p.children=[])):advPlaces()}
function npcTotal(p){return (p.npcs||[]).length+(p.children||[]).reduce((n,c)=>n+npcTotal(c),0)}
function placeCard(p){let k=(p.children||[]).length,n=npcTotal(p);return `<article class="card" style="cursor:pointer" onclick="openPlace('${p.id}')"><div class="mobtitle">${esc(p.name)}</div><div class="small muted">${[k?k+' ponto(s) de interesse':'',n?n+' NPC(s)':''].filter(Boolean).join(' · ')||'Vazio'}</div>${p.notes?`<div class="small muted clamp" style="margin-top:6px">${esc(p.notes)}</div>`:''}</article>`}
function openPlace(i){placePath.push(i);render();window.scrollTo(0,0)}
function goPlace(n){placePath=placePath.slice(0,n);render();window.scrollTo(0,0)}
function npcCard(n){return `<article class="card"><div class="row"><span class="mobtitle">${esc(n.name)}</span>${n.role?`<span class="pill">${esc(n.role)}</span>`:''}</div>${n.notes?`<div class="small muted" style="margin-top:6px;white-space:pre-wrap">${esc(n.notes)}</div>`:''}<div class="actions" style="margin-top:10px"><button onclick="npcForm('${n.id}')">Editar</button><button class="danger" onclick="deleteNpc('${n.id}')">Excluir</button></div></article>`}
function renderPlaces(){if(placePath.length&&!curPlace())placePath=[];let p=curPlace(),h;if(!p){let l=advPlaces();h=`<div class="head"><div><h1>Locais</h1><div class="muted small">${esc(adv().name)}</div></div></div><div class="row between" style="margin-bottom:10px"><div class="muted small">${l.length} local(is)</div><button class="primary" onclick="placeForm()">＋ Adicionar local</button></div>${l.length?l.map(placeCard).join(''):'<div class="empty"><b>Nenhum local ainda</b>Adicione cidades, regiões ou masmorras, como Nova Malpetrim. Dentro de cada um você coloca pontos de interesse, NPCs e anotações.</div>'}`}else{let crumbs=`<div class="crumbs"><button onclick="goPlace(0)">Locais</button>${placePath.map((x,i)=>{let q=placeAt(placePath.slice(0,i+1));return `<span class="sep">›</span>`+(i===placePath.length-1?`<b>${esc(q.name)}</b>`:`<button onclick="goPlace(${i+1})">${esc(q.name)}</button>`)}).join('')}</div>`,kids=p.children||[],npcs=p.npcs||[];h=`${crumbs}<div class="head"><h1>${esc(p.name)}</h1></div><div class="actions" style="margin-bottom:12px"><button onclick="placeForm(true)">Renomear</button><button class="danger" onclick="deletePlace()">Excluir local</button></div><h3 style="margin:6px 0">Anotações</h3><textarea rows="6" placeholder="Anote o que aconteceu aqui, rumores, detalhes do lugar..." oninput="curPlace().notes=this.value;save()">${esc(p.notes||'')}</textarea><div class="row between" style="margin:18px 0 8px"><h3 style="margin:0">Pontos de interesse</h3><button class="primary" onclick="placeForm()">＋ Ponto de interesse</button></div>${kids.length?kids.map(placeCard).join(''):'<div class="muted small">Nenhum ponto de interesse. Ex.: uma taberna, um mercado, as docas.</div>'}<div class="row between" style="margin:18px 0 8px"><h3 style="margin:0">NPCs</h3><button class="primary" onclick="npcForm()">＋ NPC</button></div>${npcs.length?npcs.map(npcCard).join(''):'<div class="muted small">Nenhum NPC neste lugar.</div>'}`}document.getElementById('view').innerHTML=h}
function placeForm(rename){let p=rename?curPlace():null,sub=!!curPlace();modal(`<div class="modalhead"><h2>${rename?'Renomear':(sub?'Novo ponto de interesse':'Novo local')}</h2><button class="x" onclick="closeModal()">×</button></div><label>Nome</label><input id="plName" value="${esc(p?p.name:'')}" placeholder="${sub?'Ex.: Taberna do Polvo Canhoto':'Ex.: Nova Malpetrim'}"><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePlace(${rename?'true':'false'})">Salvar</button></div>`)}
function savePlace(rename){let n=document.getElementById('plName').value.trim();if(!n){toast('Informe o nome');return}if(rename)curPlace().name=n;else placeKids().push({id:id(),name:n,notes:'',npcs:[],children:[]});save();closeModal();render()}
function deletePlace(){let p=curPlace(),k=(p.children||[]).length,n=npcTotal(p);confirmBox('Excluir "'+p.name+'" e tudo dentro dele ('+k+' ponto(s) de interesse, '+n+' NPC(s))? Não dá para desfazer.',()=>{let i0=p.id;placePath.pop();let l=placeKids(),i=l.findIndex(x=>x.id===i0);if(i>=0)l.splice(i,1);save();render();window.scrollTo(0,0)})}
function npcForm(nid){let n=(curPlace().npcs||[]).find(x=>x.id===nid)||{name:'',role:'',notes:''};modal(`<div class="modalhead"><h2>${nid?'Editar NPC':'Novo NPC'}</h2><button class="x" onclick="closeModal()">×</button></div><label>Nome</label><input id="npName" value="${esc(n.name)}" placeholder="Ex.: Capitão Rangel"><label>Função (opcional)</label><input id="npRole" value="${esc(n.role||'')}" placeholder="Ex.: taberneiro, guarda, informante"><label>Anotações</label><textarea id="npNotes" rows="6" placeholder="Aparência, personalidade, o que sabe, o que já aconteceu com ele...">${esc(n.notes||'')}</textarea><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveNpc('${nid||''}')">Salvar NPC</button></div>`)}
function saveNpc(nid){let name=document.getElementById('npName').value.trim();if(!name){toast('Informe o nome do NPC');return}let p=curPlace();p.npcs=p.npcs||[];let d={name,role:document.getElementById('npRole').value.trim(),notes:document.getElementById('npNotes').value.trim()};if(nid)Object.assign(p.npcs.find(x=>x.id===nid),d);else p.npcs.push({id:id(),...d});save();closeModal();render()}
function deleteNpc(nid){confirmBox('Excluir este NPC?',()=>{let p=curPlace();p.npcs=(p.npcs||[]).filter(x=>x.id!==nid);save();render()})}
function renderData(){document.getElementById('view').innerHTML=`<div class="head"><h1>Opções</h1></div><button style="margin-bottom:6px" onclick="goBack()">← Voltar ao menu</button><h3 style="margin:14px 0 2px">Dados e segurança</h3><div class="muted small">Seus dados ficam neste dispositivo.</div><div class="card"><b>Exportar backup</b><p class="muted small">Baixe suas fichas e cenas em um arquivo JSON para guardar ou transferir.</p><p class="muted small">${lastBackupText()}</p><button class="primary" onclick="exportData()">Exportar dados</button></div><div class="card"><b>Importar backup</b><p class="muted small">Restaure um arquivo JSON exportado anteriormente. Isso substitui os dados atuais.</p><input type="file" id="importFile" accept=".json,application/json"><button style="margin-top:9px" onclick="importData()">Importar backup</button></div><div class="card"><b>Sobre esta versão</b><p class="muted small">Covil do Mestre 1.0 · Protótipo pessoal. Os dados são armazenados localmente no navegador e não são sincronizados entre dispositivos.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='covil-do-mestre-backup.json';a.click();URL.revokeObjectURL(a.href);setMeta({last:Date.now()})}
function importData(){let f=document.getElementById('importFile').files[0];if(!f){toast('Selecione um arquivo');return}let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.mobs)||!(Array.isArray(d.scenes)||Array.isArray(d.adventures)))throw Error();confirmBox('Isso substituirá seus dados atuais. Continuar?',()=>{db=normalize(d);save();toast('Backup importado');goHome()})}catch(e){toast('Arquivo inválido')}};r.readAsText(f)}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal">${content}</section></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
let _yes=null;function confirmBox(msg,yes){_yes=yes;modal(`<div class="modalhead"><h2>Confirmar</h2></div><p>${esc(msg)}</p><div class="footerbtn"><button onclick="closeModal()">Cancelar</button><button class="danger" onclick="let f=_yes;closeModal();f()">Confirmar</button></div>`)}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body></html>
